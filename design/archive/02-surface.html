<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peter Huang — Surface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&family=Hanken+Grotesk:wght@400;500&display=swap">
<style>
/* Layout: a solid reading column on the left, a liquid-metal stage on the right. Text never sits on the material. */
:root{
  --pearl:#ECECEE; --graphite:#121317; --vein:#2B2E36; --haze:#6F7480; --steel:#3A6E8F;
  --display:"Familjen Grotesk","Hanken Grotesk",ui-sans-serif,sans-serif; --body:"Hanken Grotesk",ui-sans-serif,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;border-radius:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--pearl);color:var(--graphite);font:400 16px/1.5 var(--body);display:grid;grid-template-columns:minmax(340px,40%) 1fr;overflow:hidden}
::selection{background:var(--graphite);color:var(--pearl)}
.col{display:grid;grid-template-rows:auto 1fr auto;gap:32px;min-width:0;overflow:auto;
  padding:max(28px,env(safe-area-inset-top,0px)) 36px max(24px,env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px));border-right:1px solid var(--graphite)}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.name{margin:0;font:600 20px/1 var(--display);letter-spacing:-.01em}
.role{font:500 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--haze)}
.case{align-self:center;display:grid;gap:18px}
.case h1{margin:0;font:600 clamp(52px,6.4vw,104px)/.9 var(--display);letter-spacing:-.035em;text-wrap:balance}
.q{margin:0;font-size:clamp(18px,1.5vw,21px);line-height:1.35;max-width:30ch}
.meta{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.meta dt{font:500 11px/1.7 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--haze)} .meta dd{margin:0}
.pbtn{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;border:1px solid var(--graphite);font:500 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase}
.pbtn:hover,.pbtn[aria-pressed="true"]{background:var(--graphite);color:var(--pearl)} .pbtn:focus-visible{outline:2px solid var(--steel);outline-offset:3px}
.portrait{width:120px;aspect-ratio:4/5;border:1px solid var(--graphite);display:grid;place-items:end start;padding:8px;font:500 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--haze);
  background:repeating-linear-gradient(135deg,transparent 0 9px,#12131718 9px 10px)}
.pro ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
.pro li b{display:block;font:600 17px/1.2 var(--display)} .pro li span{font-size:13px;color:var(--haze)}
@media (max-width:520px){.pro ul{grid-template-columns:1fr}}
.case>*{transition:opacity .5s ease-out,transform .7s cubic-bezier(.2,.7,.2,1)}
.case.out>*,.pro.out>*{opacity:0;transform:translateY(10px)}
nav{display:flex;align-items:stretch;gap:0;border:1px solid var(--graphite);width:max-content;max-width:100%}
nav button{all:unset;box-sizing:border-box;cursor:pointer;min-width:44px;min-height:44px;display:grid;place-items:center;
  font:500 13px/1 var(--body);font-variant-numeric:tabular-nums;border-right:1px solid var(--graphite);color:var(--haze)}
nav button:last-child{border-right:0}
nav button[aria-current="true"]{background:var(--graphite);color:var(--pearl)}
nav button:hover{color:var(--graphite)} nav button[aria-current="true"]:hover{color:var(--pearl)}
nav button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.foot{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.foot a{color:var(--graphite);text-underline-offset:4px;font-size:14px}
.spec{display:grid;grid-template-columns:repeat(5,22px) auto;gap:6px;align-items:center;font:500 11px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--haze)}
.spec i{width:22px;height:22px;border:1px solid var(--graphite)}
.spec span{padding-left:10px;line-height:1.35}
.stage{position:relative;min-width:0;background:var(--vein);touch-action:pan-y;cursor:crosshair}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));padding:6px 10px;background:var(--pearl);
  font:500 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);border:1px solid var(--graphite)}
@media (max-width:860px){
  body{display:flex;flex-direction:column-reverse;overflow:auto;height:auto}
  .stage{height:54vh;min-height:300px;flex:none} .col{border-right:0;border-top:1px solid var(--graphite);overflow:visible;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="col">
  <header><p class="name">Peter Huang <span class="role" style="margin-left:12px">UX research &amp; design</span></p><button class="pbtn" id="pbtn" aria-pressed="false">Profile</button></header>
  <div>
    <article class="case" id="case" aria-live="polite">
      <h1 id="c-t">Wayfarer</h1>
      <p class="q" id="c-q">What do you notice when you stop typing?</p>
      <dl class="meta" id="c-m"></dl>
    </article>
    <article class="case pro" id="pro" hidden>
      <div class="portrait">[ portrait ]</div>
      <h1>Off the clock</h1>
      <p class="q">Psychology graduate, NYU 2026. Based in Irvine.</p>
      <ul id="pro-l"></ul>
    </article>
  </div>
  <div style="display:grid;gap:28px">
    <nav id="nav" aria-label="Projects"></nav>
    <div class="foot">
      <a href="mailto:ph2344@nyu.edu">ph2344@nyu.edu</a>
      <div class="spec" aria-label="Design system">
        <i style="background:#ECECEE"></i><i style="background:#121317"></i><i style="background:#2B2E36"></i><i style="background:#6F7480"></i><i style="background:#3A6E8F"></i>
        <span>Familjen Grotesk<br>Hanken Grotesk</span>
      </div>
    </div>
  </div>
</div>
<div class="stage" id="stage" aria-hidden="true"><canvas id="gl"></canvas><span class="cap">Drag to disturb</span></div>

<script>
const P=[
 {t:"Wayfarer",q:"What do you notice when you stop typing?",m:[["Role","Solo researcher, designer"],["Method","In-context usability tests, n=3"],["Outcome","1st of 12 teams, CUXD 2026"]]},
 {t:"Connection Study",q:"When does a screen make closeness easier?",m:[["Role","Researcher"],["Method","Interviews, n=7, thematic coding"],["Outcome","[ key finding ]"]]},
 {t:"Glenergy",q:"Can a nudge respect the person it nudges?",m:[["Role","Researcher, designer"],["Method","Behavioral experiment"],["Outcome","[ key finding ]"]]},
 {t:"Chorvivo",q:"How does a dancer remember a rehearsal?",m:[["Role","Head of design"],["Method","Customer discovery, design system"],["Outcome","MVP in build"]]},
 {t:"Antara",q:"Can a game slow you down?",m:[["Role","Designer"],["Method","Concept, sound"],["Outcome","In progress"]]}
];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const nav=document.getElementById('nav'),cs=document.getElementById('case');
const prev=document.createElement('button');prev.setAttribute('aria-label','Previous project');prev.textContent='←';nav.appendChild(prev);
const nums=P.map((p,i)=>{const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label',p.t);b.onclick=()=>go(i);nav.appendChild(b);return b});
const next=document.createElement('button');next.setAttribute('aria-label','Next project');next.textContent='→';nav.appendChild(next);
prev.onclick=()=>go((cur+P.length-1)%P.length);next.onclick=()=>go((cur+1)%P.length);
const ME=[["Jazz piano","Self-taught, Bill Evans"],["Game audio","Music for a friend's game"],["Climbing","Ongoing practice"],["Running","Ongoing practice"],["Photography","[ add a set ]"],["Contemplation","Meditation, breathwork"],["Music therapy","Volunteer"],["Older adults","Event design, volunteer"]];
document.getElementById('pro-l').innerHTML=ME.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join('');
const pro=document.getElementById('pro'),pbtn=document.getElementById('pbtn');
function setPro(on){const from=on?cs:pro,to=on?pro:cs;if(!on&&pro.hidden)return;pbtn.setAttribute('aria-pressed',String(on));S.seedT=on?40:cur*3.7;S.kick=1;
  if(reduce){from.hidden=true;to.hidden=false;return}from.classList.add('out');setTimeout(()=>{from.hidden=true;from.classList.remove('out');to.hidden=false;to.classList.add('out');requestAnimationFrame(()=>requestAnimationFrame(()=>to.classList.remove('out')))},380)}
pbtn.onclick=()=>setPro(pro.hidden);
let cur=0,swap=0;
function fill(i){const p=P[i];document.getElementById('c-t').textContent=p.t;document.getElementById('c-q').textContent=p.q;
  document.getElementById('c-m').innerHTML=p.m.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');nums.forEach((b,k)=>b.setAttribute('aria-current',String(k===i)))}
function go(i){if(!pro.hidden){cur=i;fill(i);setPro(false);return}if(i===cur)return;cur=i;S.seedT=i*3.7;S.kick=1;if(reduce){fill(i);return}
  cs.classList.add('out');clearTimeout(swap);swap=setTimeout(()=>{fill(i);cs.classList.remove('out')},380)}
fill(0);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();next.click()}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();prev.click()}});

/* material */
const stage=document.getElementById('stage'),c=document.getElementById('gl'),gl=c.getContext('webgl',{antialias:false});
const S={seed:0,seedT:0,kick:0,lx:.7,ly:.7,tlx:.7,tly:.7,pts:[],down:false,last:null};
const N=12;
const rel=e=>{const r=stage.getBoundingClientRect();return[(e.clientX-r.left)/r.width,1-(e.clientY-r.top)/r.height]};
stage.addEventListener('pointerdown',e=>{S.down=true;S.last=rel(e)});
addEventListener('pointerup',()=>{S.down=false;S.last=null});
stage.addEventListener('pointermove',e=>{const p=rel(e);S.tlx=p[0];S.tly=p[1];
  if((S.down||e.pointerType==='mouse'&&e.buttons)&&S.last){const vx=p[0]-S.last[0],vy=p[1]-S.last[1];if(Math.hypot(vx,vy)>.004){S.pts.push({x:p[0],y:p[1],vx,vy,age:0});if(S.pts.length>N)S.pts.shift();S.last=p}}});
const fs=`precision highp float;uniform vec2 r;uniform float t,seed,kick;uniform vec2 L;uniform vec4 P[${N}];uniform float A[${N}];
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.02+vec2(3.1,1.7);a*=.5;}return v;}
vec2 disturb(vec2 p,float as){vec2 o=vec2(0.);for(int i=0;i<${N};i++){vec2 d=p-P[i].xy*vec2(as,1.);float w=exp(-dot(d,d)/.012)*exp(-A[i]*1.6);o-=P[i].zw*w*9.;}return o;}
float field(vec2 p){vec2 q=vec2(fbm(p+seed),fbm(p+vec2(5.2,1.3)-seed));
 vec2 s=vec2(fbm(p+3.5*q+vec2(1.7,9.2)+t*.02),fbm(p+3.5*q+vec2(8.3,2.8)-t*.015));return fbm(p+3.*s+kick*.4);}
void main(){vec2 uv=gl_FragCoord.xy/r;float as=r.x/r.y;vec2 p=uv*vec2(as,1.);p+=disturb(p,as);vec2 pp=p*1.6;
 float e=.004;float h0=field(pp),hx=field(pp+vec2(e,0.)),hy=field(pp+vec2(0.,e));
 vec3 nrm=normalize(vec3((h0-hx)/e*.05,(h0-hy)/e*.05,1.));
 vec3 ld=normalize(vec3(L*2.-1.,.9));float diff=max(dot(nrm,ld),0.);float spec=pow(max(dot(reflect(-ld,nrm),vec3(0,0,1)),0.),28.);
 float band=fract(h0*6.);float vein=smoothstep(.36,.3,h0)+smoothstep(.06,.0,abs(band-.5)-.44)*.25;
 vec3 pearl=vec3(.86,.87,.9),deep=vec3(.09,.1,.13);
 vec3 base=mix(pearl*.55,pearl,diff);base=mix(base,deep,clamp(vein,0.,1.)*.9);
 float ph=h0*2.6+dot(nrm.xy,vec2(1.3,.7));vec3 cyan=vec3(.45,.8,1.),pink=vec3(1.,.56,.84),gold=vec3(1.,.86,.62);vec3 iri=mix(mix(cyan,pink,.5+.5*sin(ph*6.28)),gold,.5+.5*sin(ph*4.1+1.3)*.6)*1.15;
 float film=smoothstep(.38,.7,h0)*(.35+.65*diff)*(.6+.4*abs(sin(h0*9.+seed)));
 vec3 col=mix(base,iri*(.5+.55*diff),film*.62)+spec*vec3(1.,.97,.93)*.9;
 col+=(h(gl_FragCoord.xy+fract(t))-.5)*.03;gl_FragColor=vec4(col,1.);}`;
const vs='attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}';
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
if(gl){const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const a=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
 const U={};['r','t','seed','kick','L','P','A'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
 const size=()=>{const d=Math.min(devicePixelRatio||1,1.25);c.width=stage.clientWidth*d;c.height=stage.clientHeight*d;gl.viewport(0,0,c.width,c.height)};
 new ResizeObserver(size).observe(stage);size();
 const pv=new Float32Array(N*4),av=new Float32Array(N).fill(99);let prevT=performance.now(),T=0;
 const frame=now=>{const dt=Math.min(.05,(now-prevT)/1000);prevT=now;T+=reduce?0:dt;
   S.seed+=(S.seedT-S.seed)*(reduce?1:.035);S.kick*=reduce?0:.97;S.lx+=(S.tlx-S.lx)*.05;S.ly+=(S.tly-S.ly)*.05;
   S.pts.forEach(q=>q.age+=dt);S.pts=S.pts.filter(q=>q.age<4);pv.fill(0);av.fill(99);S.pts.forEach((q,i)=>{pv.set([q.x,q.y,q.vx,q.vy],i*4);av[i]=q.age});
   gl.uniform2f(U.r,c.width,c.height);gl.uniform1f(U.t,reduce?30:T);gl.uniform1f(U.seed,S.seed);gl.uniform1f(U.kick,S.kick);gl.uniform2f(U.L,S.lx,S.ly);
   gl.uniform4fv(U.P,pv);gl.uniform1fv(U.A,av);gl.drawArrays(gl.TRIANGLES,0,3);if(!document.hidden)requestAnimationFrame(frame)};
 requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(!document.hidden){prevT=performance.now();requestAnimationFrame(frame)}});
}
</script>
</body>
</html>
